
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONEST - URL Shortener</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#080d19;color:white;
 min-height:100vh;padding:25px 16px;
}
.container{width:100%;max-width:650px;margin:auto}
.logo{text-align:center;font-size:34px;font-weight:900;
 letter-spacing:3px;color:#60a5fa}
.tag{text-align:center;color:#9ca3af;margin:10px 0 30px}
.card{
 background:#151e30;padding:24px;border-radius:18px;
 border:1px solid #29364c;margin-bottom:20px
}
h2{margin-top:0;text-align:center}
label{display:block;margin:18px 0 8px;color:#cbd5e1}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #475569;background:#0b1220;
 color:white;font-size:15px;outline:none
}
input:focus{border-color:#3b82f6}
button{
 padding:13px;border:0;border-radius:10px;
 background:#2563eb;color:white;font-size:15px;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
.primary{width:100%;margin-top:20px}
.copy{background:#16a34a}
.secondary{background:#334155}
.danger{background:#991b1b}
.result{
 display:none;margin-top:20px;padding:15px;
 background:#0b1220;border-radius:12px;overflow-wrap:anywhere
}
.result a,.history a{color:#60a5fa;overflow-wrap:anywhere}
.message{color:#fbbf24;overflow-wrap:anywhere}
.section-title{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;margin-bottom:15px
}
.section-title h2{margin:0;text-align:left}
.section-title button{font-size:12px}
.history-item{
 background:#0b1220;border:1px solid #29364c;
 padding:15px;border-radius:12px;margin-bottom:12px;
 overflow-wrap:anywhere
}
.history-item p{color:#cbd5e1;font-size:13px;overflow-wrap:anywhere}
.history-actions{display:flex;gap:8px;flex-wrap:wrap}
.history-actions button{flex:1;min-width:100px;margin-top:8px}
.stats{font-size:13px;color:#94a3b8}
.empty{text-align:center;color:#94a3b8;padding:20px}
.note{text-align:center;color:#64748b;font-size:12px;margin:25px}
</style>
</head>
<body>
<div class="container">

 <div class="logo">HONEST</div>
 <div class="tag">Short links. Big possibilities.</div>

 <div class="card">
  <h2>Shorten your URL</h2>

  <form id="shortForm">
   <label for="longUrl">Paste your long URL</label>
   <input id="longUrl" type="url"
    placeholder="https://example.com/your-long-link"
    required>

   <label for="alias">Custom alias (optional)</label>
   <input id="alias" type="text"
    placeholder="my-link" maxlength="30"
    pattern="[a-zA-Z0-9_-]+">

   <button class="primary" id="submitBtn" type="submit">
    Shorten URL
   </button>
  </form>

  <div class="result" id="result">
   <p>Your short link:</p>
   <a id="shortLink" href="#" target="_blank"
    rel="noopener noreferrer"></a>
   <button class="copy primary" id="copyBtn" type="button">
    Copy Link
   </button>
  </div>

  <p class="message" id="message" role="status"></p>
 </div>

 <div class="card">
  <div class="section-title">
   <h2>Link History</h2>
   <button class="secondary" id="refreshBtn">Refresh</button>
  </div>

  <p class="stats" id="totalLinks">0 saved links</p>

  <div id="historyList">
   <div class="empty">No links saved yet.</div>
  </div>

  <button class="danger primary" id="clearBtn" type="button">
   Clear Local History
  </button>
 </div>

 <div class="note">
  HONEST © 2026 · Simple URL Management
 </div>

</div>

<script>
const form = document.getElementById("shortForm");
const btn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const result = document.getElementById("result");
const shortLink = document.getElementById("shortLink");
const historyList = document.getElementById("historyList");

const STORAGE_KEY = "honest_link_history";

function getHistory(){
 try{
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 }catch{
  return [];
 }
}

function saveHistory(items){
 localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

async function copyText(text){
 try{
  await navigator.clipboard.writeText(text);
  return true;
 }catch{
  return false;
 }
}

function safeLink(value){
 try{
  const url = new URL(value);
  return ["http:","https:"].includes(url.protocol) ? url.href : null;
 }catch{
  return null;
 }
}

async function loadHistory(){
 const items = getHistory();

 document.getElementById("totalLinks").textContent =
  items.length + (items.length === 1 ? " saved link" : " saved links");

 historyList.replaceChildren();

 if(!items.length){
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = "No links saved yet.";
  historyList.appendChild(empty);
  return;
 }

 for(const item of items){
  const card = document.createElement("div");
  card.className = "history-item";

  const heading = document.createElement("strong");
  heading.textContent = item.code;

  const original = document.createElement("p");
  original.textContent = "Original: " + item.originalUrl;

  const link = document.createElement("a");
  link.href = item.shortUrl;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = item.shortUrl;

  const stats = document.createElement("p");
  stats.className = "stats";
  stats.textContent = "Clicks: Loading...";

  const actions = document.createElement("div");
  actions.className = "history-actions";

  const copyButton = document.createElement("button");
  copyButton.className = "copy";
  copyButton.textContent = "Copy";

  copyButton.addEventListener("click", async()=>{
   const ok = await copyText(item.shortUrl);
   copyButton.textContent = ok ? "Copied!" : "Copy failed";
  });

  const openButton = document.createElement("button");
  openButton.className = "secondary";
  openButton.textContent = "Open Link";
  openButton.addEventListener("click",()=>{
   window.open(item.shortUrl,"_blank","noopener");
  });

  actions.append(copyButton,openButton);
  card.append(heading,original,link,stats,actions);
  historyList.appendChild(card);

  try{
   const response = await fetch(
    "/api/stats/" + encodeURIComponent(item.code)
   );

   if(!response.ok) throw new Error("Stats unavailable");

   const data = await response.json();
   stats.textContent = "Clicks: " + data.clicks;
  }catch{
   stats.textContent = "Clicks: Unavailable";
  }
 }
}

form.addEventListener("submit",async function(e){
 e.preventDefault();

 message.textContent = "";
 result.style.display = "none";

 const url = document.getElementById("longUrl").value.trim();
 const alias = document.getElementById("alias").value.trim();

 if(!safeLink(url)){
  message.textContent = "Please enter a valid HTTP or HTTPS URL.";
  return;
 }

 btn.disabled = true;
 btn.textContent = "Creating link...";

 try{
  const response = await fetch("/api/shorten",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({url,alias})
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Could not create link.");
  }

  const validShortUrl = safeLink(data.shortUrl);

  if(!validShortUrl){
   throw new Error("Invalid short link received.");
  }

  const code = new URL(validShortUrl).pathname.slice(1);

  shortLink.href = validShortUrl;
  shortLink.textContent = validShortUrl;
  result.style.display = "block";

  const items = getHistory();

  items.unshift({
   code,
   originalUrl: url,
   shortUrl: validShortUrl,
   createdAt: new Date().toISOString()
  });

  saveHistory(items.slice(0,100));

  document.getElementById("longUrl").value = "";
  document.getElementById("alias").value = "";

  await loadHistory();

 }catch(error){
  message.textContent = error.message;
 }finally{
  btn.disabled = false;
  btn.textContent = "Shorten URL";
 }
});

document.getElementById("copyBtn").addEventListener("click",async()=>{
 const ok = await copyText(shortLink.href);
 document.getElementById("copyBtn").textContent =
  ok ? "Copied!" : "Copy manually";
});

document.getElementById("refreshBtn").addEventListener("click",loadHistory);

document.getElementById("clearBtn").addEventListener("click",()=>{
 if(!confirm("Clear all locally saved history? Database links will NOT be deleted.")){
  return;
 }
 localStorage.removeItem(STORAGE_KEY);
 loadHistory();
});

loadHistory();
</script>
</body>
</html>
