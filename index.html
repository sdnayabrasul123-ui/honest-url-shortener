
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HONEST - URL Shortener</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#080d19;color:white;
 min-height:100vh;padding:25px 16px;
}
.container{width:100%;max-width:650px;margin:auto}
.logo{text-align:center;font-size:34px;font-weight:900;
 letter-spacing:3px;color:#60a5fa}
.tag{text-align:center;color:#9ca3af;margin:10px 0 30px}
.card{
 background:#151e30;padding:24px;border-radius:18px;
 border:1px solid #29364c;margin-bottom:20px
}
h2{margin-top:0;text-align:center}
label{display:block;margin:18px 0 8px;color:#cbd5e1}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #475569;background:#0b1220;
 color:white;font-size:15px;outline:none
}
input:focus{border-color:#3b82f6}
button{
 padding:13px;border:0;border-radius:10px;
 background:#2563eb;color:white;font-size:15px;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
.primary{width:100%;margin-top:20px}
.copy{background:#16a34a}
.secondary{background:#334155}
.danger{background:#991b1b}
.result{
 display:none;margin-top:20px;padding:15px;
 background:#0b1220;border-radius:12px;overflow-wrap:anywhere
}
.result a,.history a{color:#60a5fa;overflow-wrap:anywhere}
.message{color:#fbbf24;overflow-wrap:anywhere}
.section-title{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;margin-bottom:15px
}
.section-title h2{margin:0;text-align:left}
.section-title button{font-size:12px}
.history-item{
 background:#0b1220;border:1px solid #29364c;
 padding:15px;border-radius:12px;margin-bottom:12px;
 overflow-wrap:anywhere
}
.history-item p{color:#cbd5e1;font-size:13px;overflow-wrap:anywhere}
.history-actions{display:flex;gap:8px;flex-wrap:wrap}
.history-actions button{flex:1;min-width:100px;margin-top:8px}
.stats{font-size:13px;color:#94a3b8}
.empty{text-align:center;color:#94a3b8;padding:20px}
.note{text-align:center;color:#64748b;font-size:12px;margin:25px}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1}
.active{background:#2563eb}
#accountStatus{color:#86efac;font-size:14px;overflow-wrap:anywhere}
</style>
</head>

<body>
<div class="container">

<div class="logo">HONEST</div>
<div class="tag">Short links. Big possibilities.</div>

<!-- AUTHENTICATION -->
<div class="card" id="authCard">
 <h2 id="authTitle">Welcome to HONEST</h2>

 <div class="tabs" id="authTabs">
  <button id="loginTab" class="active" type="button">Login</button>
  <button id="signupTab" class="secondary" type="button">Sign Up</button>
 </div>

 <form id="authForm">
  <label for="email">Email address</label>
  <input id="email" type="email"
   placeholder="you@example.com" required>

  <label for="password">Password</label>
  <input id="password" type="password"
   placeholder="Enter password" minlength="6" required>

  <button class="primary" id="authSubmit" type="submit">
   Login
  </button>
 </form>

 <button id="forgotBtn" class="secondary primary" type="button">
  Forgot Password?
 </button>

 <form id="resetForm" class="hidden">
  <label for="newPassword">New password</label>
  <input id="newPassword" type="password"
   minlength="6" required>
  <button class="primary" type="submit">Update Password</button>
 </form>

 <p id="authMessage" class="message" role="status"></p>
 <p id="accountStatus"></p>

 <button id="logoutBtn" class="danger primary hidden"
  type="button">Logout</button>
</div>

<!-- URL SHORTENER -->
<div class="card" id="shortenerCard">
 <h2>Shorten your URL</h2>

 <form id="shortForm">
  <label for="longUrl">Paste your long URL</label>
  <input id="longUrl" type="url"
   placeholder="https://example.com/your-link" required>

  <label for="alias">Custom alias (optional)</label>
  <input id="alias" type="text"
   placeholder="my-link" maxlength="30"
   pattern="[a-zA-Z0-9_-]+">

  <button class="primary" id="submitBtn" type="submit">
   Shorten URL
  </button>
 </form>

 <div class="result" id="result">
  <p>Your short link:</p>
  <a id="shortLink" href="#" target="_blank"
   rel="noopener noreferrer"></a>
  <button class="copy primary" id="copyBtn" type="button">
   Copy Link
  </button>
 </div>

 <p class="message" id="message" role="status"></p>
</div>

<!-- LINK HISTORY -->
<div class="card">
 <div class="section-title">
  <h2>Link History</h2>
  <button class="secondary" id="refreshBtn">Refresh</button>
 </div>

 <p class="stats" id="totalLinks">0 saved links</p>
 <div id="historyList">
  <div class="empty">Login to view your links.</div>
 </div>
</div>

<div class="note">HONEST © 2026 · Simple URL Management</div>
</div>

<script>
const SUPABASE_URL =
 "https://eszxcijknskjmthvotgx.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_z2A424CjymZNvgf9XXmycw_Qm1vKHPc";

const supabase = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);

let currentSession = null;
let authMode = "login";

const $ = id => document.getElementById(id);

function safeLink(value){
 try{
  const u = new URL(value);
  return ["http:","https:"].includes(u.protocol) ? u.href : null;
 }catch{
  return null;
 }
}

function showAuthMessage(text){
 $("authMessage").textContent = text;
}

function setMode(mode){
 authMode = mode;
 $("authTitle").textContent =
  mode === "login" ? "Welcome to HONEST" : "Create your account";
 $("authSubmit").textContent =
  mode === "login" ? "Login" : "Create Account";
 $("loginTab").className =
  mode === "login" ? "active" : "secondary";
 $("signupTab").className =
  mode === "signup" ? "active" : "secondary";
 showAuthMessage("");
}

$("loginTab").addEventListener("click",()=>setMode("login"));
$("signupTab").addEventListener("click",()=>setMode("signup"));

function renderAuth(){
 const loggedIn = !!currentSession;

 $("authForm").classList.toggle("hidden",loggedIn);
 $("authTabs").classList.toggle("hidden",loggedIn);
 $("forgotBtn").classList.toggle("hidden",loggedIn);
 $("logoutBtn").classList.toggle("hidden",!loggedIn);

 $("accountStatus").textContent = loggedIn
  ? "Logged in: " + currentSession.user.email
  : "Please log in or create an account.";

 $("shortForm").classList.toggle("hidden",!loggedIn);

 if(!loggedIn){
  $("historyList").innerHTML =
   '<div class="empty">Login to view your links.</div>';
  $("totalLinks").textContent = "0 saved links";
 }else{
  loadHistory();
 }
}

// SIGNUP AND LOGIN
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 showAuthMessage("");

 const email = $("email").value.trim();
 const password = $("password").value;

 $("authSubmit").disabled = true;

 try{
  if(authMode === "signup"){
   const {data,error} = await supabase.auth.signUp({
    email,
    password,
    options:{
     emailRedirectTo:window.location.origin
    }
   });

   if(error) throw error;

   if(!data.session){
    showAuthMessage(
     "Account created! Check your email and confirm your address before logging in."
    );
   }else{
    showAuthMessage("Account created successfully!");
   }

  }else{
   const {error} = await supabase.auth.signInWithPassword({
    email,password
   });

   if(error) throw error;

   showAuthMessage("Login successful!");
  }

 }catch(error){
  showAuthMessage(error.message);
 }finally{
  $("authSubmit").disabled = false;
 }
});

// FORGOT PASSWORD
$("forgotBtn").addEventListener("click",async()=>{
 const email = $("email").value.trim();

 if(!email){
  showAuthMessage("Enter your email address first.");
  return;
 }

 try{
  const {error} = await supabase.auth.resetPasswordForEmail(
   email,
   {redirectTo:window.location.origin}
  );

  if(error) throw error;

  showAuthMessage("Password reset email sent. Check your inbox.");

 }catch(error){
  showAuthMessage(error.message);
 }
});

// PASSWORD UPDATE
$("resetForm").addEventListener("submit",async e=>{
 e.preventDefault();

 try{
  const {error} = await supabase.auth.updateUser({
   password:$("newPassword").value
  });

  if(error) throw error;

  $("resetForm").classList.add("hidden");
  showAuthMessage("Password updated successfully.");

 }catch(error){
  showAuthMessage(error.message);
 }
});

// LOGOUT
$("logoutBtn").addEventListener("click",async()=>{
 const {error} = await supabase.auth.signOut();

 if(error){
  showAuthMessage(error.message);
 }
});

// SESSION CHANGES
supabase.auth.onAuthStateChange((event,session)=>{
 currentSession = session;
 renderAuth();

 if(event === "PASSWORD_RECOVERY"){
  $("resetForm").classList.remove("hidden");
  showAuthMessage("Enter your new password.");
 }
});

async function apiFetch(path,options={}){
 if(!currentSession){
  throw new Error("Please log in first");
 }

 const {data:{session}} = await supabase.auth.getSession();

 if(!session){
  currentSession = null;
  renderAuth();
  throw new Error("Your session expired. Please log in again.");
 }

 currentSession = session;

 const response = await fetch(path,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+session.access_token,
   ...options.headers
  }
 });

 const data = await response.json().catch(()=>({}));

 if(!response.ok){
  throw new Error(data.error || "Request failed");
 }

 return data;
}

// CREATE SHORT LINK
$("shortForm").addEventListener("submit",async e=>{
 e.preventDefault();

 $("message").textContent = "";
 $("result").style.display = "none";

 const url = $("longUrl").value.trim();
 const alias = $("alias").value.trim();

 if(!safeLink(url)){
  $("message").textContent = "Enter a valid HTTP or HTTPS URL.";
  return;
 }

 $("submitBtn").disabled = true;
 $("submitBtn").textContent = "Creating link...";

 try{
  const data = await apiFetch("/api/shorten",{
   method:"POST",
   body:JSON.stringify({url,alias})
  });

  const valid = safeLink(data.shortUrl);

  if(!valid) throw new Error("Invalid short link received.");

  $("shortLink").href = valid;
  $("shortLink").textContent = valid;
  $("result").style.display = "block";

  $("longUrl").value = "";
  $("alias").value = "";

  await loadHistory();

 }catch(error){
  $("message").textContent = error.message;
 }finally{
  $("submitBtn").disabled = false;
  $("submitBtn").textContent = "Shorten URL";
 }
});

// LINK HISTORY
async function loadHistory(){
 if(!currentSession) return;

 $("historyList").innerHTML =
  '<div class="empty">Loading links...</div>';

 try{
  const data = await apiFetch("/api/links");
  const items = Array.isArray(data) ? data :
   (data.links || []);

  $("totalLinks").textContent =
   items.length + (items.length === 1 ?
   " saved link" : " saved links");

  $("historyList").replaceChildren();

  if(!items.length){
   $("historyList").innerHTML =
    '<div class="empty">No links saved yet.</div>';
   return;
  }

  for(const item of items){
   const code = item.code;
   const originalUrl = item.original_url || item.originalUrl;
   const shortUrl = window.location.origin + "/" + code;

   const card = document.createElement("div");
   card.className = "history-item";

   const heading = document.createElement("strong");
   heading.textContent = code;

   const original = document.createElement("p");
   original.textContent = "Original: " + originalUrl;

   const link = document.createElement("a");
   link.href = shortUrl;
   link.target = "_blank";
   link.rel = "noopener noreferrer";
   link.textContent = shortUrl;

   const stats = document.createElement("p");
   stats.className = "stats";
   stats.textContent = "Clicks: " +
    (item.clicks ?? "Unavailable");

   const actions = document.createElement("div");
   actions.className = "history-actions";

   const copyButton = document.createElement("button");
   copyButton.className = "copy";
   copyButton.textContent = "Copy";

   copyButton.onclick = async()=>{
    try{
     await navigator.clipboard.writeText(shortUrl);
     copyButton.textContent = "Copied!";
    }catch{
     copyButton.textContent = "Copy failed";
    }
   };

   const openButton = document.createElement("button");
   openButton.className = "secondary";
   openButton.textContent = "Open Link";
   openButton.onclick = ()=>window.open(
    shortUrl,"_blank","noopener"
   );

   actions.append(copyButton,openButton);
   card.append(heading,original,link,stats,actions);
   $("historyList").appendChild(card);
  }

 }catch(error){
  $("historyList").innerHTML =
   '<div class="empty"></div>';
  $("historyList").firstChild.textContent = error.message;
 }
}

$("copyBtn").addEventListener("click",async()=>{
 try{
  await navigator.clipboard.writeText($("shortLink").href);
  $("copyBtn").textContent = "Copied!";
 }catch{
  $("copyBtn").textContent = "Copy manually";
 }
});

$("refreshBtn").addEventListener("click",loadHistory);

// INITIAL SESSION
async function initialize(){
 const {data,error} = await supabase.auth.getSession();

 if(error){
  showAuthMessage(error.message);
 }

 currentSession = data.session;
 renderAuth();
}

initialize();
</script>
</body>
</html>
